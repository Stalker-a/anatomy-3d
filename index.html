<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Анатомия 3D</title>
  <meta name="description" content="Интерактивный 3D-атлас соединений костей с объяснениями по «Атласу анатомии человека» Р. Д. Синельникова." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo">A</span><span>Анатомия 3D</span></a>
    <nav id="nav" class="nav"></nav>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Поиск: рус. или лат." autocomplete="off" />
      <div id="searchResults" class="search-results hidden"></div>
    </div>
  </header>

  <main id="app">
    <section id="pageHome" class="page hidden"></section>
    <section id="pageRegion" class="page hidden"></section>

    <section id="pageModel" class="page model hidden">
      <div id="stage">
        <canvas id="view"></canvas>
        <div id="loading" class="loading">Загрузка модели…</div>
        <div id="hoverTip" class="hover-tip hidden"></div>
        <div id="pickChip" class="pick-chip hidden"></div>
        <div class="view-bar" role="group" aria-label="Ракурс">
          <button data-view="ant">Спереди</button>
          <button data-view="post">Сзади</button>
          <button data-view="lat">Сбоку</button>
          <button data-view="med">Медиально</button>
          <button data-view="sup">Сверху</button>
          <button data-view="spin" title="Вращение">⟳</button>
        </div>
        <div class="view-tools">
          <button id="resetView" class="icon-btn" title="Исходный вид">⌂</button>
          <button id="toggleBones" class="icon-btn" title="Кости: прозрачные / обычные">◑</button>
          <button id="toggleOthers" class="icon-btn" title="Показать структуры других суставов">✦</button>
        </div>
      </div>
      <aside id="panel" class="panel">
        <nav id="crumbs" class="crumbs"></nav>
        <header class="model-head">
          <h1 id="modelTitle"></h1>
          <div id="modelLa" class="la"></div>
        </header>
        <div class="tabs" role="tablist">
          <button data-tab="about" class="active">Описание</button>
          <button data-tab="parts">Структуры <span id="partsCount" class="count"></span></button>
          <button data-tab="quiz">Тест</button>
        </div>
        <div id="tabAbout" class="tab-body"></div>
        <div id="tabParts" class="tab-body hidden"></div>
        <div id="tabQuiz" class="tab-body quiz hidden"></div>
      </aside>
    </section>
  </main>

  <footer class="credits">
    Объяснения написаны по «Атласу анатомии человека» Р. Д. Синельникова (т. 1). 3D-модели — <a href="https://www.z-anatomy.com/" target="_blank" rel="noopener">Z-Anatomy</a> (CC BY-SA 4.0), на основе BodyParts3D.
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
